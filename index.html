<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GTA VI — 倒计时</title>
<meta name="description" content="Grand Theft Auto VI 发售倒计时" />
<style>
:root{
  color-scheme:dark;
  --ink:#f4f8ff;
  --dim:rgba(244,248,255,.58);
  --faint:rgba(244,248,255,.32);
  --a1:#22d3ee; --a2:#f472b6; --a3:#fbbf24;
  --bg:#070b18;
  --glass:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.2);
  --shadow:0 16px 48px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden}
#parallax-wrap{position:absolute;inset:-4%;z-index:0;will-change:transform}
#parallax-wrap.off{transform:none!important}
.bg{position:absolute;inset:0;background:#070b18 center/cover no-repeat;opacity:0;transition:opacity 1.2s ease}
#gradient-bg{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s;
  background:
    radial-gradient(ellipse 60% 45% at 20% 30%, rgba(34,211,255,.28), transparent 60%),
    radial-gradient(ellipse 55% 40% at 80% 70%, rgba(244,114,182,.22), transparent 55%),
    linear-gradient(160deg, rgba(8,12,28,.2), rgba(8,12,28,.55));
}
#gradient-bg.active{opacity:1}
#light-beams{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;overflow:hidden}
#light-beams.active{opacity:.35}
#light-beams i{position:absolute;top:-20%;width:2px;height:140%;
  background:linear-gradient(180deg,transparent,rgba(180,240,255,.55),transparent);
  filter:blur(6px);transform:rotate(18deg);animation:beam 7s ease-in-out infinite}
#light-beams i:nth-child(2){left:30%;animation-delay:-2s;background:linear-gradient(180deg,transparent,rgba(255,170,230,.45),transparent)}
#light-beams i:nth-child(3){left:70%;animation-delay:-4s}
#light-beams i:nth-child(1){left:12%}
@keyframes beam{0%,100%{opacity:.2;transform:rotate(18deg) translateX(0)}50%{opacity:.9;transform:rotate(18deg) translateX(40px)}}
#scanlines{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay}
#scanlines.active{opacity:.45}
#rain{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0}
#rain.active{opacity:.55}
#rain i{position:absolute;top:-12%;width:1px;height:12%;
  background:linear-gradient(180deg,transparent,rgba(180,220,255,.7));
  animation:rain linear infinite}
@keyframes rain{to{transform:translateY(120vh)}}
#fog{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .8s}
#fog.active{opacity:.55}
#fog .fog-layer{position:absolute;inset:-20%;
  background:radial-gradient(ellipse 50% 40% at 30% 60%, rgba(200,220,255,.2), transparent 50%),
             radial-gradient(ellipse 45% 35% at 70% 40%, rgba(255,200,230,.12), transparent 50%);
  filter:blur(24px);animation:fogMove 18s ease-in-out infinite alternate}
#fog .fog-layer:nth-child(2){animation-duration:24s;animation-direction:alternate-reverse;opacity:.7}
@keyframes fogMove{from{transform:translate(-3%,2%) scale(1)}to{transform:translate(4%,-2%) scale(1.08)}}
#stars{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0}
#stars.active{opacity:.7}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
  box-shadow:0 0 6px rgba(255,255,255,.8);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
#particles{position:absolute;inset:0;z-index:2;pointer-events:none;display:none}
#particles.on{display:block}
#particles i{position:absolute;width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.75);box-shadow:0 0 8px rgba(34,211,255,.8);
  animation:part 8s linear infinite}
@keyframes part{0%{transform:translateY(0) scale(1);opacity:0}
  15%{opacity:1}100%{transform:translateY(-80vh) scale(.4);opacity:0}}
#orb{position:absolute;z-index:2;width:220px;height:220px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(34,211,255,.35),transparent 70%);
  filter:blur(30px);transform:translate(-50%,-50%);opacity:0;transition:opacity .4s;left:50%;top:50%}
#ripple{position:absolute;z-index:3;pointer-events:none;border-radius:50%;border:2px solid rgba(255,255,255,.5);
  animation:rip .6s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes rip{from{width:0;height:0;opacity:.8}to{width:280px;height:280px;opacity:0}}
#veil{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,11,24,.45),rgba(7,11,24,.2) 35%,rgba(7,11,24,.72))}

.content{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:24px 16px}
.label{font-size:clamp(1.1rem,3.5vw,1.7rem);font-weight:800;letter-spacing:.12em;text-align:center;
  background:linear-gradient(90deg,#9adfff,#e0c3ff 45%,var(--a2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 24px rgba(244,114,182,.25))}
.neon .label{filter:none;-webkit-text-fill-color:#fff;color:#fff;
  text-shadow:0 0 12px var(--a1),0 0 28px var(--a2),0 0 48px var(--a2)}
.countdown{display:flex;align-items:flex-start;gap:clamp(8px,2.2vw,22px);margin-top:8px}
.unit{display:flex;flex-direction:column;align-items:center;gap:10px}
.num-wrap{position:relative;isolation:isolate;overflow:hidden;
  min-width:clamp(72px,16vw,120px);padding:16px 10px 14px;border-radius:22px;
  background:linear-gradient(150deg,rgba(255,255,255,.22),rgba(255,255,255,.06) 45%,rgba(255,255,255,.12));
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.08);
  transform-style:preserve-3d;will-change:transform}
.num-wrap::before{content:'';position:absolute;left:12%;right:12%;top:0;height:1px;z-index:4;
  background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.75}
.num-wrap::after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 40%)}
.num-wrap:hover{transform:translateY(-2px) scale(1.02);border-color:rgba(255,255,255,.45)}
.num-wrap.flip-anim .num{animation:flipNum .45s ease-out}
@keyframes flipNum{0%{transform:rotateX(-70deg) scale(.92);opacity:.3}60%{transform:rotateX(8deg) scale(1.02)}100%{transform:none;opacity:1}}
.num-wrap.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{0%{transform:scale(1.05)}45%{transform:scale(.97)}100%{transform:scale(1)}}
canvas.fluid{position:absolute;inset:-4px;z-index:0;opacity:.5;pointer-events:none;
  width:calc(100% + 8px);height:calc(100% + 8px);border-radius:24px}
.sheen{position:absolute;top:0;bottom:0;width:34%;left:-40%;z-index:4;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.32),transparent);
  transform:skewX(-16deg);animation:sheen 6.5s ease-in-out infinite;mix-blend-mode:screen}
@keyframes sheen{0%{left:-40%;opacity:0}20%{opacity:.85}60%{opacity:.4}100%{left:105%;opacity:0}}
.num{position:relative;z-index:2;display:block;text-align:center;
  font-size:clamp(36px,8vw,84px);font-weight:750;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,#eaf7ff 50%,rgba(255,255,255,.72));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.35));transition:transform .25s}
.neon .num{-webkit-text-fill-color:#fff;background:none;
  text-shadow:0 0 10px var(--a1),0 0 24px var(--a2),0 0 40px var(--a2)}
.glitch .num{animation:glitchText 4s infinite}
@keyframes glitchText{0%,92%,100%{transform:none}93%{transform:translate(-2px,1px);filter:hue-rotate(30deg) brightness(1.3)}
  94%{transform:translate(2px,-1px)}95%{transform:translate(-1px,0);filter:none}}
.unit-label{font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}
.dot{font-size:clamp(20px,3.5vw,34px);font-weight:200;color:var(--faint);padding-bottom:22px}
.date{margin:2px 0 0;font-size:.95rem;color:var(--dim);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.hint{margin:4px 0 0;font-size:.78rem;color:var(--faint);letter-spacing:.08em}
.hint kbd{display:inline-block;min-width:1.4em;margin:0 2px;padding:1px 6px;border-radius:6px;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);font-size:.72rem;font-weight:700;color:var(--ink)}
#settings-btn{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;z-index:20;
  width:42px;height:42px;border-radius:14px;border:1px solid var(--line);
  background:rgba(8,12,24,.55);backdrop-filter:blur(12px);color:var(--ink);
  font-size:1.1rem;cursor:pointer}
#settings-panel{position:fixed;top:70px;right:16px;width:min(320px,calc(100vw - 24px));max-height:min(78vh,640px);
  background:rgba(12,16,32,.92);border:1px solid rgba(255,255,255,.16);border-radius:16px;
  backdrop-filter:blur(20px);padding:16px 14px;z-index:30;overflow:auto;
  opacity:0;transform:translateY(-8px) scale(.96);pointer-events:none;transition:all .28s ease}
#settings-panel.open{opacity:1;transform:none;pointer-events:auto}
.panel-title{margin:0 0 12px;font-size:.85rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.panel-section{margin-bottom:12px}
.section-title{margin:0 0 8px;font-size:.7rem;font-weight:700;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.setting-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:.82rem}
.setting-label{color:var(--ink)}
.toggle{width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.12);
  border:1px solid var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .2s}
.toggle.active{background:linear-gradient(90deg,var(--a1),var(--a2))}
.toggle.active::after{transform:translateX(18px)}
.custom-select,.date-input{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:6px 8px;font-size:.78rem;max-width:160px}
#toolbar{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:20;display:flex;gap:8px}
.toolbar-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);
  background:rgba(8,12,24,.5);backdrop-filter:blur(12px);color:var(--ink);cursor:pointer;font-size:.95rem}
.toolbar-btn:hover{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.08)}
#volume-control{position:absolute;right:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:20;
  display:none;align-items:center;gap:8px;font-size:.75rem;color:var(--dim)}
#volume-control.show{display:flex}
#volume-slider{width:80px}
#milestone-overlay{position:absolute;inset:0;z-index:25;display:grid;place-items:center;
  background:rgba(7,11,24,.55);opacity:0;pointer-events:none;transition:opacity .35s}
#milestone-overlay.show{opacity:1}
.milestone-text{font-size:clamp(1.4rem,5vw,2.4rem);font-weight:900;letter-spacing:.12em;
  background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 30px rgba(244,114,182,.4));text-align:center;padding:0 20px}
#music-hint{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);z-index:18;
  font-size:.7rem;color:var(--faint);display:none;text-align:center;line-height:1.5}
#music-hint.show{display:block}
.theme-neon .num-wrap{border-color:rgba(244,114,182,.45);box-shadow:var(--shadow),0 0 24px rgba(244,114,182,.2)}
.theme-retro .label{background:linear-gradient(90deg,#fbbf24,#f97316 50%,#ef4444);
  -webkit-background-clip:text;background-clip:text}
.theme-retro .num{background:linear-gradient(180deg,#fff7ed,#fdba74 60%,rgba(251,146,60,.7));
  -webkit-background-clip:text;background-clip:text}
@media (max-width:480px){
  .num-wrap{min-width:64px;padding:12px 6px}
  #settings-panel{top:64px;right:8px;left:8px;width:auto}
}
@media (prefers-reduced-motion:reduce){
  #fog .fog-layer,#rain i,.sheen,#particles i{animation:none}
}
</style>
</head>
<body class="theme-dark">
<div id="app">
  <div id="parallax-wrap">
    <div class="bg" id="bg0"></div>
    <div class="bg" id="bg1"></div>
    <div class="bg" id="bg2"></div>
  </div>
  <div id="gradient-bg"></div>
  <div id="light-beams"><i></i><i></i><i></i></div>
  <div id="scanlines"></div>
  <div id="rain"></div>
  <div id="fog"><div class="fog-layer"></div><div class="fog-layer"></div></div>
  <div id="stars"></div>
  <div id="particles"></div>
  <div id="orb"></div>
  <div id="veil"></div>

  <div class="content">
    <div class="label" id="title">Grand Theft Auto VI</div>
    <div class="countdown" id="countdown">
      <div class="unit"><div class="num-wrap"><span class="num" id="d">--</span></div><span class="unit-label" id="lab-d">天</span></div>
      <span class="dot">:</span>
      <div class="unit"><div class="num-wrap"><span class="num" id="h">--</span></div><span class="unit-label" id="lab-h">时</span></div>
      <span class="dot">:</span>
      <div class="unit"><div class="num-wrap"><span class="num" id="m">--</span></div><span class="unit-label" id="lab-m">分</span></div>
      <span class="dot">:</span>
      <div class="unit"><div class="num-wrap"><span class="num" id="s">--</span></div><span class="unit-label" id="lab-s">秒</span></div>
    </div>
    <p class="date" id="target-date">2026.11.19</p>
    <p class="hint" id="shortcuts-hint"><kbd>F</kbd> 全屏 <kbd>M</kbd> 静音 <kbd>?</kbd> 帮助</p>
  </div>

  <button id="settings-btn" type="button" aria-label="设置">⚙</button>
  <div id="settings-panel">
    <p class="panel-title" id="panel-title">特效设置</p>
    <div class="panel-section">
      <div class="section-title">视觉</div>
      <div class="setting-item"><span class="setting-label">霓虹文字</span><div class="toggle active" data-feature="neon"></div></div>
      <div class="setting-item"><span class="setting-label">渐变背景</span><div class="toggle active" data-feature="gradient"></div></div>
      <div class="setting-item"><span class="setting-label">故障艺术</span><div class="toggle" data-feature="glitch"></div></div>
      <div class="setting-item"><span class="setting-label">光束</span><div class="toggle" data-feature="beams"></div></div>
      <div class="setting-item"><span class="setting-label">扫描线</span><div class="toggle" data-feature="scanlines"></div></div>
      <div class="setting-item"><span class="setting-label">雨滴</span><div class="toggle" data-feature="rain"></div></div>
      <div class="setting-item"><span class="setting-label">烟雾</span><div class="toggle" data-feature="fog"></div></div>
      <div class="setting-item"><span class="setting-label">星空</span><div class="toggle" data-feature="stars"></div></div>
      <div class="setting-item"><span class="setting-label">3D 视差</span><div class="toggle" data-feature="parallax"></div></div>
    </div>
    <div class="panel-section">
      <div class="section-title">交互</div>
      <div class="setting-item"><span class="setting-label">粒子</span><div class="toggle" data-feature="particles"></div></div>
      <div class="setting-item"><span class="setting-label">光球跟随</span><div class="toggle" data-feature="particleFollow"></div></div>
      <div class="setting-item"><span class="setting-label">点击波纹</span><div class="toggle" data-feature="ripple"></div></div>
      <div class="setting-item"><span class="setting-label">数字翻牌</span><div class="toggle" data-feature="flip"></div></div>
      <div class="setting-item"><span class="setting-label">倒计时音效</span><div class="toggle" data-feature="sound"></div></div>
    </div>
    <div class="panel-section">
      <div class="section-title">主题 / 语言</div>
      <div class="setting-item"><span class="setting-label">主题</span>
        <select class="custom-select" id="theme-select">
          <option value="dark">暗黑</option>
          <option value="neon">霓虹</option>
          <option value="retro">复古</option>
        </select>
      </div>
      <div class="setting-item"><span class="setting-label">语言</span>
        <select class="custom-select" id="language-select">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>
    </div>
    <div class="panel-section">
      <div class="section-title">自定义倒计时</div>
      <div class="setting-item"><span class="setting-label">目标日期</span>
        <input class="date-input" id="custom-date" type="datetime-local" value="2026-11-19T00:00" />
      </div>
      <div class="setting-item"><span class="setting-label">标题</span>
        <input class="date-input" id="custom-label" type="text" placeholder="Grand Theft Auto VI" style="width:140px" />
      </div>
    </div>
  </div>

  <div id="toolbar">
    <button class="toolbar-btn" id="fullscreen-btn" type="button" title="全屏 (F)">⛶</button>
    <button class="toolbar-btn" id="share-btn" type="button" title="分享">↗</button>
    <button class="toolbar-btn" id="music-btn" type="button" title="音乐">♫</button>
  </div>
  <div id="volume-control">
    <span>🔊</span>
    <input id="volume-slider" type="range" min="0" max="100" value="45" />
    <span id="volume-value">45%</span>
  </div>
  <div id="music-hint">单击 播放/暂停 · 双击 切换曲目</div>
  <div id="milestone-overlay"><div class="milestone-text" id="milestone-text"></div></div>
</div>

<script>
(function(){
'use strict';

/* ── config ── */
var DEFAULT_TARGET = '2026-11-19T00:00:00';
var TRACKS = ['./music/vice_beach.mp3','./music/neon_rush.mp3'];
var IMAGES = [
  './gta6-images/Vice_City_01.jpg','./gta6-images/Vice_City_02.jpg','./gta6-images/Vice_City_03.jpg',
  './gta6-images/Vice_City_04.jpg','./gta6-images/Vice_City_05.jpg','./gta6-images/Vice_City_06.jpg',
  './gta6-images/Leonida_Keys_01.jpg','./gta6-images/Leonida_Keys_02.jpg','./gta6-images/Leonida_Keys_03.jpg',
  './gta6-images/Grassrivers.jpg','./gta6-images/Ambrosia.jpg','./gta6-images/Mount_Kalaga.jpg',
  './gta6-images/Port_Gellhorn.jpg','./gta6-images/Jason_and_Lucia_01.jpg',
  './gta6-images/Jason_and_Lucia_02.jpg','./gta6-images/Jason_and_Lucia_03.jpg',
  './gta6-images/Official_Cover_Art.jpg',
  './gta6-images/web_featured.jpg','./gta6-images/web_mediaDesktop.jpg','./gta6-images/web_an-extended-look.jpg'
];

var i18n = {
  zh:{title:'Grand Theft Auto VI',d:'天',h:'时',m:'分',s:'秒',panel:'特效设置',hint:'F 全屏 · M 静音'},
  en:{title:'Grand Theft Auto VI',d:'Days',h:'Hrs',m:'Min',s:'Sec',panel:'Settings',hint:'F fullscreen · M mute'},
  ja:{title:'Grand Theft Auto VI',d:'日',h:'時',m:'分',s:'秒',panel:'設定',hint:'F 全画面 · M ミュート'},
  ko:{title:'Grand Theft Auto VI',d:'일',h:'시',m:'분',s:'초',panel:'설정',hint:'F 전체화면 · M 음소거'}
};

var F = {
  neon:true, gradient:true, glitch:false, beams:false, scanlines:true,
  rain:false, fog:false, stars:false, parallax:false,
  particles:false, particleFollow:false, ripple:false, flip:false,
  sound:false
};
var lang = 'zh';
var theme = 'dark';
var target = new Date(DEFAULT_TARGET);
var customLabel = '';
var lastShown = {};
var milestones = [];

try{
  var raw = localStorage.getItem('gta6-cd-prefs');
  if(raw){
    var p = JSON.parse(raw);
    if(p.features) Object.keys(F).forEach(function(k){ if(typeof p.features[k]==='boolean') F[k]=p.features[k]; });
    if(p.lang && i18n[p.lang]) lang=p.lang;
    if(p.theme) theme=p.theme;
    if(p.target) target = new Date(p.target);
    if(p.label) customLabel=p.label;
    if(p.vol!=null) audio.volume = Math.max(0,Math.min(1,p.vol));
  }
}catch(e){}

function savePrefs(){
  try{
    localStorage.setItem('gta6-cd-prefs', JSON.stringify({
      features:F, lang:lang, theme:theme,
      target: target.toISOString(), label:customLabel,
      vol: audio.volume
    }));
  }catch(e){}
}

/* ── audio ── */
var audio = new Audio();
audio.loop = false;
audio.preload = 'none';
audio.src = TRACKS[0];
var trackIdx = 0;
var audioCtx = null;

function ensureCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playTick(){
  if(!F.sound) return;
  try{
    var ctx = ensureCtx();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.value=0.04;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.05);
  }catch(e){}
}

/* ── background rotator ── */
var bgEls = [document.getElementById('bg0'),document.getElementById('bg1'),document.getElementById('bg2')];
var activeBg = 0;
var pool = IMAGES.slice();
function nextBg(){
  if(!pool.length) pool = IMAGES.slice();
  var i = Math.floor(Math.random()*pool.length);
  var url = pool.splice(i,1)[0];
  var next = (activeBg+1)%3;
  bgEls[next].style.backgroundImage = 'url("'+url+'")';
  bgEls[next].style.opacity = '1';
  bgEls[activeBg].style.opacity = '0';
  bgEls[(next+1)%3].style.opacity = '0';
  activeBg = next;
}
nextBg();
setInterval(nextBg, 14000);

/* ── effects builders ── */
function buildRain(){
  var el = document.getElementById('rain');
  if(el.childElementCount) return;
  for(var i=0;i<40;i++){
    var d=document.createElement('i');
    d.style.left=(Math.random()*100)+'%';
    d.style.animationDuration=(0.7+Math.random()*0.8)+'s';
    d.style.animationDelay=(-Math.random()*2)+'s';
    el.appendChild(d);
  }
}
function buildStars(){
  var el = document.getElementById('stars');
  if(el.childElementCount) return;
  for(var i=0;i<80;i++){
    var d=document.createElement('i');
    d.style.left=(Math.random()*100)+'%';
    d.style.top=(Math.random()*100)+'%';
    d.style.animationDelay=(-Math.random()*3)+'s';
    el.appendChild(d);
  }
}
function buildParticles(){
  var el = document.getElementById('particles');
  if(el.childElementCount) return;
  for(var i=0;i<24;i++){
    var d=document.createElement('i');
    d.style.left=(Math.random()*100)+'%';
    d.style.bottom='0';
    d.style.animationDelay=(-Math.random()*8)+'s';
    d.style.animationDuration=(6+Math.random()*6)+'s';
    el.appendChild(d);
  }
}

function applyFeatures(){
  var app = document.getElementById('app');
  app.classList.toggle('neon', !!F.neon);
  app.classList.toggle('glitch', !!F.glitch);
  document.getElementById('gradient-bg').classList.toggle('active', !!F.gradient);
  document.getElementById('light-beams').classList.toggle('active', !!F.beams);
  document.getElementById('scanlines').classList.toggle('active', !!F.scanlines);
  document.getElementById('fog').classList.toggle('active', !!F.fog);
  document.getElementById('stars').classList.toggle('active', !!F.stars);
  var rain = document.getElementById('rain');
  rain.classList.toggle('active', !!F.rain);
  if(F.rain) buildRain();
  if(F.stars) buildStars();
  var parts = document.getElementById('particles');
  parts.classList.toggle('on', !!F.particles);
  if(F.particles) buildParticles();
  var pw = document.getElementById('parallax-wrap');
  pw.classList.toggle('off', !F.parallax);
  var orb = document.getElementById('orb');
  orb.style.opacity = F.particleFollow ? '0.85' : '0';
  document.body.classList.remove('theme-dark','theme-neon','theme-retro');
  document.body.classList.add('theme-'+theme);
  document.querySelectorAll('.toggle').forEach(function(t){
    var f=t.getAttribute('data-feature');
    if(f && f in F) t.classList.toggle('active', !!F[f]);
  });
}

function applyI18n(){
  var t = i18n[lang] || i18n.zh;
  document.getElementById('title').textContent = customLabel || t.title;
  document.getElementById('lab-d').textContent=t.d;
  document.getElementById('lab-h').textContent=t.h;
  document.getElementById('lab-m').textContent=t.m;
  document.getElementById('lab-s').textContent=t.s;
  document.getElementById('panel-title').textContent=t.panel;
  document.getElementById('shortcuts-hint').innerHTML = t.hint.replace(/\b([A-Z?])\b/g, '<kbd>$1</kbd>');
}

/* ── countdown ── */
function pad(n){ return String(n).padStart(2,'0'); }

function checkMilestones(days){
  var pts = [365,180,100,60,30,14,7,3,1];
  for(var i=0;i<pts.length;i++){
    if(days === pts[i] && milestones.indexOf(days)<0){
      milestones.push(days);
      var msg = days===1 ? (lang==='en'?'TOMORROW!':'明天！') :
                (lang==='en' ? days+' DAYS LEFT' : '还有 '+days+' 天');
      var ov=document.getElementById('milestone-overlay');
      document.getElementById('milestone-text').textContent = msg;
      ov.classList.add('show');
      setTimeout(function(){ ov.classList.remove('show'); }, 2600);
      break;
    }
  }
}

function tick(){
  var now = new Date();
  var ms = target - now;
  var parts = {d:0,h:0,m:0,s:0};
  if(ms>0){
    var sec = Math.floor(ms/1000);
    parts.d = Math.floor(sec/86400);
    parts.h = Math.floor(sec%86400/3600);
    parts.m = Math.floor(sec%3600/60);
    parts.s = sec%60;
  }
  checkMilestones(parts.d);
  ['d','h','m','s'].forEach(function(k){
    var el = document.getElementById(k);
    var v = (k==='d') ? String(parts.d) : pad(parts[k]);
    if(lastShown[k]!==v){
      lastShown[k]=v;
      el.textContent = v;
      var wrap = el.parentElement;
      if(wrap){
        wrap.classList.remove('pop','flip-anim');
        void wrap.offsetWidth;
        wrap.classList.add(F.flip ? 'flip-anim' : 'pop');
      }
      if(k==='s') playTick();
    }
  });
  var dfmt = lang==='zh' ? (target.getFullYear()+'.'+pad(target.getMonth()+1)+'.'+pad(target.getDate()))
    : (target.toLocaleDateString());
  document.getElementById('target-date').textContent = dfmt;
}
tick();
setInterval(tick, 1000);

/* ── fluid glass ── */
document.querySelectorAll('.num-wrap').forEach(function(w,i){
  var cv=document.createElement('canvas');
  cv.className='fluid'; cv.width=200; cv.height=150;
  w.insertBefore(cv,w.firstChild);
  var sheen=document.createElement('div');
  sheen.className='sheen'; sheen.style.animationDelay=(i*0.7)+'s';
  w.appendChild(sheen);
  var ctx=cv.getContext('2d'); var t=i;
  (function loop(){
    t+=0.007;
    ctx.clearRect(0,0,cv.width,cv.height);
    var g=ctx.createLinearGradient(0,0,cv.width,cv.height);
    g.addColorStop(0,'rgba(255,255,255,.08)');
    g.addColorStop(0.45,'rgba(140,230,255,'+(0.08+0.05*Math.sin(t))+')');
    g.addColorStop(0.75,'rgba(255,140,220,'+(0.05+0.04*Math.cos(t))+')');
    g.addColorStop(1,'rgba(255,255,255,.06)');
    ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
    var x=cv.width*(0.4+0.25*Math.sin(t));
    var y=cv.height*(0.45+0.2*Math.cos(t));
    var rg=ctx.createRadialGradient(x,y,2,x,y,70);
    rg.addColorStop(0,'rgba(255,255,255,.25)');
    rg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,cv.width,cv.height);
    requestAnimationFrame(loop);
  })();
});

/* ── UI bindings ── */
document.querySelectorAll('.toggle').forEach(function(t){
  t.addEventListener('click', function(){
    var f = t.getAttribute('data-feature');
    if(!f || !(f in F)) return;
    F[f] = !F[f];
    t.classList.toggle('active', F[f]);
    applyFeatures();
    savePrefs();
  });
});

document.getElementById('theme-select').addEventListener('change', function(){
  theme=this.value; applyFeatures(); savePrefs();
});
document.getElementById('language-select').addEventListener('change', function(){
  lang=this.value; applyI18n(); savePrefs();
});
document.getElementById('custom-date').addEventListener('change', function(){
  var d=new Date(this.value);
  if(!isNaN(d)){ target=d; lastShown={}; tick(); savePrefs(); }
});
document.getElementById('custom-label').addEventListener('input', function(){
  customLabel=this.value.trim(); applyI18n(); savePrefs();
});

var settingsBtn = document.getElementById('settings-btn');
var settingsPanel = document.getElementById('settings-panel');
settingsBtn.addEventListener('click', function(e){
  e.stopPropagation();
  settingsPanel.classList.toggle('open');
});
document.addEventListener('click', function(e){
  if(!settingsPanel.contains(e.target) && e.target!==settingsBtn)
    settingsPanel.classList.remove('open');
});

function toggleFullscreen(){
  if(!document.fullscreenElement) (document.documentElement.requestFullscreen||function(){}).call(document.documentElement);
  else (document.exitFullscreen||function(){}).call(document);
}
document.getElementById('fullscreen-btn').onclick = toggleFullscreen;

document.getElementById('share-btn').onclick = function(){
  var data = {title:'GTA VI Countdown', text:'距离 GTA VI 还有…', url:location.href};
  if(navigator.share) navigator.share(data).catch(function(){});
  else if(navigator.clipboard){
    navigator.clipboard.writeText(location.href);
    showToast(lang==='en'?'Link copied':'链接已复制');
  }
};

function showToast(msg){
  var ov=document.getElementById('milestone-overlay');
  document.getElementById('milestone-text').textContent=msg;
  ov.classList.add('show');
  setTimeout(function(){ov.classList.remove('show');},1600);
}

var musicBtn = document.getElementById('music-btn');
var volCtrl = document.getElementById('volume-control');
var volSlider = document.getElementById('volume-slider');
var volValue = document.getElementById('volume-value');
volSlider.value = Math.round(audio.volume*100);
volValue.textContent = Math.round(audio.volume*100)+'%';

var clickTimer = null;
musicBtn.addEventListener('click', function(){
  if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; return; }
  clickTimer = setTimeout(function(){
    clickTimer=null;
    if(audio.paused){
      document.getElementById('music-hint').classList.add('show');
      volCtrl.classList.add('show');
      musicBtn.textContent='❚❚';
      audio.play().catch(function(){
        musicBtn.textContent='♫';
        document.getElementById('music-hint').classList.remove('show');
        volCtrl.classList.remove('show');
      });
    } else {
      audio.pause();
      musicBtn.textContent='♫';
      document.getElementById('music-hint').classList.remove('show');
      volCtrl.classList.remove('show');
    }
  }, 220);
});
musicBtn.addEventListener('dblclick', function(){
  if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; }
  trackIdx = (trackIdx+1)%TRACKS.length;
  audio.src = TRACKS[trackIdx];
  if(!audio.paused) audio.play();
  showToast(TRACKS[trackIdx].split('/').pop());
});
audio.addEventListener('ended', function(){
  trackIdx=(trackIdx+1)%TRACKS.length;
  audio.src=TRACKS[trackIdx];
  audio.play();
});
volSlider.addEventListener('input', function(){
  audio.volume = this.value/100;
  volValue.textContent = this.value+'%';
  savePrefs();
});

/* parallax + orb + ripple */
var app = document.getElementById('app');
var orb = document.getElementById('orb');
app.addEventListener('pointermove', function(e){
  if(F.parallax){
    var x=(e.clientX/innerWidth-0.5)*20;
    var y=(e.clientY/innerHeight-0.5)*14;
    document.getElementById('parallax-wrap').style.transform='translate('+(-x)+'px,'+(-y)+'px)';
  }
  if(F.particleFollow){
    orb.style.left=e.clientX+'px';
    orb.style.top=e.clientY+'px';
  }
});
app.addEventListener('pointerdown', function(e){
  if(!F.ripple) return;
  var r=document.createElement('div');
  r.id='ripple';
  r.style.left=e.clientX+'px';
  r.style.top=e.clientY+'px';
  document.body.appendChild(r);
  setTimeout(function(){ r.remove(); }, 650);
});

document.addEventListener('keydown', function(e){
  if(e.key==='f'||e.key==='F') toggleFullscreen();
  if(e.key==='m'||e.key==='M'){
    audio.muted = !audio.muted;
    showToast(audio.muted ? (lang==='en'?'Muted':'已静音') : (lang==='en'?'Sound on':'声音开'));
  }
  if(e.key==='?'||e.key==='/') settingsPanel.classList.toggle('open');
  if(e.key==='Escape') settingsPanel.classList.remove('open');
});

/* init UI state from prefs */
document.getElementById('theme-select').value = theme;
document.getElementById('language-select').value = lang;
document.getElementById('custom-date').value = target.toISOString().slice(0,16);
document.getElementById('custom-label').value = customLabel;
applyFeatures();
applyI18n();
})();
</script>
</body>
</html>
