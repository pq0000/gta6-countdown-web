<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GTA VI 倒计时</title>
<meta name="description" content="Grand Theft Auto VI 发售倒计时" />
<style>
:root{
  color-scheme:dark;
  --ink:#f5f7fa;
  --dim:rgba(245,247,250,.55);
  --glass:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.22);
  --shadow:0 18px 48px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;color:var(--ink);
  font-family:system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#bg{
  position:fixed;inset:0;
  background:#05060a center/cover no-repeat;
  transform:scale(1.04);
  transition:opacity .8s ease, background-image .8s ease;
}
#veil{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(0,0,0,.25) 0%, rgba(0,0,0,.62) 100%),
    linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55));
  pointer-events:none;
}
#app{
  position:relative;z-index:2;
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;
  padding:24px 16px 28px;
}
.kicker{
  margin:0;font-size:12px;letter-spacing:.35em;text-transform:uppercase;
  color:var(--dim);font-weight:600;
}
h1{
  margin:0;font-size:clamp(1.4rem,4vw,2rem);font-weight:800;letter-spacing:.08em;
  background:linear-gradient(90deg,#9adfff,#e8c2ff 50%,#ffb6d9);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.date{
  margin:0;font-size:.95rem;color:var(--dim);letter-spacing:.12em;
}
.countdown{
  display:flex;align-items:center;gap:clamp(8px,2vw,20px);
  perspective:1000px;
}
.unit{display:flex;flex-direction:column;align-items:center;gap:10px}
.num-wrap{
  position:relative;isolation:isolate;overflow:hidden;
  min-width:clamp(78px,17vw,120px);
  padding:18px 8px 16px;
  border-radius:22px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.07) 45%,rgba(255,255,255,.11) 100%);
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border:1px solid rgba(255,255,255,.26);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.4);
}
.num-wrap::before{
  content:'';position:absolute;left:14%;right:14%;top:0;height:1px;z-index:4;
  background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.8;
}
.num-wrap::after{
  content:'';position:absolute;inset:0;border-radius:inherit;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 42%);
}
canvas.fluid{
  position:absolute;inset:-6px;z-index:0;opacity:.5;pointer-events:none;
  width:calc(100% + 12px);height:calc(100% + 12px);border-radius:24px;
}
.sheen{
  position:absolute;top:0;bottom:0;width:34%;left:-40%;z-index:4;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-18deg);
  animation:sheen 6s ease-in-out infinite;
  mix-blend-mode:screen;
}
.num{
  position:relative;z-index:2;display:block;text-align:center;
  font-size:clamp(38px,8vw,84px);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,#eaf6ff 50%,rgba(255,255,255,.7));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.35));
}
.unit-label{
  font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;
  color:var(--dim);
}
.dot{
  font-size:clamp(22px,3.5vw,36px);font-weight:200;color:rgba(255,255,255,.28);
  padding-bottom:24px;
}
.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
}
.btn{
  min-width:96px;padding:10px 14px;border-radius:999px;
  border:1px solid var(--line);
  background:rgba(10,12,20,.45);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--ink);font-size:.82rem;font-weight:600;letter-spacing:.04em;
  cursor:pointer;transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.08)}
.btn:active{transform:translateY(0)}
.foot{
  margin:0;font-size:.72rem;color:rgba(255,255,255,.35);text-align:center;
  max-width:520px;line-height:1.5;
}
@keyframes sheen{
  0%{left:-40%;opacity:0}
  20%{opacity:.85}
  60%{opacity:.4}
  100%{left:105%;opacity:0}
}
.num-wrap.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{0%{transform:scale(1.05)}45%{transform:scale(.97)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  .sheen{animation:none}
  #bg{transition:none}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="veil"></div>

<main id="app">
  <p class="kicker">Release Countdown</p>
  <h1>Grand Theft Auto VI</h1>
  <p class="date">目标发售日 · 2026.11.19</p>

  <div class="countdown" id="countdown">
    <div class="unit">
      <div class="num-wrap"><span class="num" id="d">--</span></div>
      <span class="unit-label">天</span>
    </div>
    <span class="dot">:</span>
    <div class="unit">
      <div class="num-wrap"><span class="num" id="h">--</span></div>
      <span class="unit-label">时</span>
    </div>
    <span class="dot">:</span>
    <div class="unit">
      <div class="num-wrap"><span class="num" id="m">--</span></div>
      <span class="unit-label">分</span>
    </div>
    <span class="dot">:</span>
    <div class="unit">
      <div class="num-wrap"><span class="num" id="s">--</span></div>
      <span class="unit-label">秒</span>
    </div>
  </div>

  <div class="toolbar">
    <button type="button" class="btn" id="music-btn">音乐 关</button>
    <button type="button" class="btn" id="next-bg-btn">换背景</button>
    <button type="button" class="btn" id="full-btn">全屏</button>
  </div>

  <p class="foot">背景为官方公开素材 · 仅个人展示 · 版权归 Rockstar Games</p>
</main>

<script>
var TARGET = new Date('2026-11-19T00:00:00');
var TRACKS = ['music/vice_beach.mp3','music/neon_rush.mp3'];
var IMAGES = [
  'gta6-images/Vice_City_01.jpg','gta6-images/Vice_City_02.jpg','gta6-images/Vice_City_03.jpg',
  'gta6-images/Vice_City_04.jpg','gta6-images/Vice_City_05.jpg','gta6-images/Vice_City_06.jpg',
  'gta6-images/Leonida_Keys_01.jpg','gta6-images/Leonida_Keys_02.jpg','gta6-images/Leonida_Keys_03.jpg',
  'gta6-images/Grassrivers.jpg','gta6-images/Ambrosia.jpg','gta6-images/Mount_Kalaga.jpg',
  'gta6-images/Port_Gellhorn.jpg','gta6-images/Jason_and_Lucia_01.jpg',
  'gta6-images/Jason_and_Lucia_02.jpg','gta6-images/Jason_and_Lucia_03.jpg',
  'gta6-images/Official_Cover_Art.jpg',
  'gta6-images/web_featured.jpg','gta6-images/web_mediaDesktop.jpg',
  'gta6-images/web_musicDesktop.jpg','gta6-images/web_onlyInLeonidaDesktop.jpg',
  'gta6-images/web_an-extended-look.jpg'
];

var bgEl = document.getElementById('bg');
var pool = IMAGES.slice();
var audio = new Audio();
audio.loop = true;
audio.volume = 0.45;
audio.src = TRACKS[0];
var musicOn = false;
var trackIdx = 0;

function pad(n){ return String(n).padStart(2,'0'); }

function tick(){
  var now = new Date();
  var ms = TARGET - now;
  var parts = { d:0, h:0, m:0, s:0 };
  if (ms > 0) {
    var sec = Math.floor(ms/1000);
    parts.d = Math.floor(sec/86400);
    parts.h = Math.floor(sec%86400/3600);
    parts.m = Math.floor(sec%3600/60);
    parts.s = sec%60;
  }
  ['d','h','m','s'].forEach(function(k){
    var el = document.getElementById(k);
    var v = k==='d' ? String(parts.d) : pad(parts[k]);
    if (el.textContent !== v) {
      el.textContent = v;
      var wrap = el.parentElement;
      if (wrap) {
        wrap.classList.remove('pop');
        void wrap.offsetWidth;
        wrap.classList.add('pop');
      }
    }
  });
}
tick();
setInterval(tick, 1000);

function nextBg(){
  if (!pool.length) pool = IMAGES.slice();
  var i = Math.floor(Math.random()*pool.length);
  var url = pool.splice(i,1)[0];
  bgEl.style.backgroundImage = 'url(\'' + url + '\')';
}
nextBg();
setInterval(nextBg, 14000);

document.getElementById('next-bg-btn').onclick = nextBg;

document.getElementById('music-btn').onclick = function(){
  musicOn = !musicOn;
  this.textContent = musicOn ? '音乐 开' : '音乐 关';
  if (musicOn) {
    audio.play().catch(function(){ musicOn = false; document.getElementById('music-btn').textContent = '音乐 关'; });
  } else {
    audio.pause();
  }
};

document.getElementById('full-btn').onclick = function(){
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen||function(){}).call(document.documentElement);
  } else {
    (document.exitFullscreen||function(){}).call(document);
  }
};

// glass fluid canvases
(function(){
  var wraps = document.querySelectorAll('.num-wrap');
  wraps.forEach(function(w, i){
    var cv = document.createElement('canvas');
    cv.className = 'fluid';
    cv.width = 240; cv.height = 180;
    w.insertBefore(cv, w.firstChild);
    var sheen = document.createElement('div');
    sheen.className = 'sheen';
    sheen.style.animationDelay = (i*0.65)+'s';
    w.appendChild(sheen);
    var ctx = cv.getContext('2d');
    var t = i;
    (function frame(){
      t += 0.007;
      var g = ctx.createLinearGradient(0,0,cv.width,cv.height);
      var p = 0.5 + 0.4*Math.sin(t);
      g.addColorStop(0,'rgba(255,255,255,.08)');
      g.addColorStop(Math.max(.05,Math.min(.9,p*.4)),'rgba(180,230,255,.18)');
      g.addColorStop(1,'rgba(255,255,255,.06)');
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.fillStyle = g;
      ctx.fillRect(0,0,cv.width,cv.height);
      var x = cv.width*(0.4+0.25*Math.sin(t));
      var y = cv.height*(0.45+0.2*Math.cos(t));
      var rg = ctx.createRadialGradient(x,y,3,x,y,80);
      rg.addColorStop(0,'rgba(255,255,255,.28)');
      rg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(0,0,cv.width,cv.height);
      requestAnimationFrame(frame);
    })();
  });
})();
</script>
</body>
</html>
